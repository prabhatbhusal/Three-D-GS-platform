# /etc/nginx/sites-available/rcaas  (then: ln -s it into sites-enabled,
# replace example.com, `sudo certbot --nginx -d example.com` for HTTPS).
# One domain: /api/ goes to the Express API, everything else to Next.

server {
    listen 80;
    server_name example.com;

    # Scans upload in 8 MB chunks; website photos are originals, up to 25 MB.
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_request_buffering off;   # stream uploads straight through
        proxy_read_timeout 300s;       # finalising a big upload takes a while
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# Behind Cloudflare's proxy (orange cloud), add its ranges with
# set_real_ip_from + real_ip_header CF-Connecting-IP, or every visitor
# arrives as a Cloudflare IP and shares one rate limit.
